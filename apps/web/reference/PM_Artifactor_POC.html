<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM Artifactor — Full POC</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --teal:#0f766e;--teal2:#0d9488;--teal3:#14b8a6;--deep:#0b3d39;
    --bg:#f4f5f7;--card:#fff;--ink:#1a1d23;--muted:#6b7280;--faint:#9aa1ab;
    --line:#e6e8ec;--line2:#d4d8de;
    --share:#0d9488;--share-bg:#e8f6f4;--scratch:#b45309;--scratch-bg:#fef3c7;
    --win:#059669;--win-bg:#d1fae5;--flag:#e11d48;--flag-bg:#ffe4e6;
    --amber:#d97706;--amber-bg:#fef3c7;--violet:#7c3aed;--violet-bg:#f3e8ff;--blue:#2563eb;--blue-bg:#e0edff;
  }
  body{background:var(--bg);font-family:'Public Sans',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  .mono{font-family:'IBM Plex Mono',monospace}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:2px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%;background:#fff;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--teal2);box-shadow:0 0 0 3px rgba(13,148,136,.12)}
  :focus-visible{outline:2px solid var(--teal2);outline-offset:2px}
  @keyframes pmpulse{0%,100%{opacity:1}50%{opacity:.3}}
  @keyframes pmfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pmgrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes pmdraw{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
  .view{animation:pmfade .3s ease-out}
  .live{animation:pmpulse 2s ease-in-out infinite}
  .bar{transform-origin:left;animation:pmgrow .9s cubic-bezier(.2,.7,.2,1)}
  .spark{stroke-dasharray:400;animation:pmdraw 1.6s ease-out forwards}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px}
  .nav{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:#cddbd8;font-size:13px;font-weight:500;cursor:pointer;transition:background .12s}
  .nav:hover{background:rgba(255,255,255,.07)}.nav.on{background:rgba(255,255,255,.13);color:#fff}
  .nav .ic{width:16px;text-align:center;opacity:.9;font-size:13px}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .navhead{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:#6f9c96;margin:14px 10px 5px}
  .btn{background:var(--teal);color:#fff;font-weight:600;font-size:13px;padding:8px 14px;border-radius:9px;transition:filter .12s}.btn:hover{filter:brightness(1.07)}
  .ghost{background:#fff;border:1px solid var(--line2);color:var(--ink);font-weight:600;font-size:12.5px;padding:7px 12px;border-radius:9px;transition:background .12s}.ghost:hover{background:var(--bg)}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--share-bg);color:var(--teal)}
  .tag{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
  .row:hover{background:#fafbfc}
  .avatar{border-radius:10px;background:linear-gradient(145deg,var(--teal),var(--teal3));color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
  .h1{font-size:22px;font-weight:800;letter-spacing:-.01em}.h2{font-size:15px;font-weight:700}
  .sub{font-size:13px;color:var(--muted)}
  .grid{display:grid;gap:16px}
  .kpi{font-size:22px;font-weight:800;letter-spacing:-.02em}
  label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ============================== SAMPLE DATA ============================== */
const D = {
  vault:{path:"~/PM-Vault",enc:true,size:"4.1 MB",enrich:"1h ago"},
  portfolio:{name:"Digital Banking Portfolio",health:74,invest:"$12.4M",benefit:"$4.1M realized"},
  programs:[
    {id:"pay",name:"Payments Modernization",health:81,status:"On track",benefit:68,projects:2,meth:"SAFe"},
    {id:"cx",name:"Customer Experience",health:59,status:"At risk",benefit:41,projects:1,meth:"Hybrid"}
  ],
  projects:[
    {id:"checkout",name:"Mobile Checkout Revamp",prog:"cx",meth:"Scrum",health:62,status:"At risk",next:"Sprint 14 ends Mar 18",src:"Jira",spi:0.92,cpi:1.03},
    {id:"ledger",name:"Ledger Migration",prog:"pay",meth:"Waterfall",health:70,status:"At risk",next:"Gate 2 · Mar 22",src:"Azure DevOps",spi:0.88,cpi:0.96},
    {id:"fraud",name:"Fraud Signals v2",prog:"pay",meth:"Kanban",health:86,status:"On track",next:"Continuous",src:"GitHub",spi:1.0,cpi:1.02}
  ],

    {id:"dana",name:"Dana Okafor",role:"Sr. Backend Eng",load:68,flow:"high-complexity backend",skill:[["Distributed systems",5,5],["Kubernetes",2,4]],last1:"Mar 12"},
    {id:"sam",name:"Sam Rivera",role:"Frontend Eng",load:122,flow:"polished small/med UI",skill:[["React / UI",5,5],["Accessibility",3,5]],last1:"Mar 10"},
    {id:"lin",name:"Lin Chen",role:"Data Eng",load:84,flow:"steady, load-bearing work",skill:[["Data pipelines",5,4],["Infra",3,5]],last1:"Mar 8"},
    {id:"theo",name:"Theo Adékúnlé",role:"QA / Automation",load:55,flow:"consistent, thorough",skill:[["Test automation",4,5],["SDET coding",2,5]],last1:"Mar 5"}
  ],
  stakeholders:[
    {id:"priya",name:"Priya N.",role:"CFO · Exec Sponsor",inf:5,int:4,stance:"supporter",cadence:"Biweekly · due Thu",cares:"Ledger benefit, budget"},
    {id:"marcus",name:"Marcus L.",role:"Head of Risk",inf:4,int:5,stance:"skeptic",cadence:"Weekly · due Mon",cares:"Fraud Signals, RAID"},
    {id:"elena",name:"Elena V.",role:"VP Product",inf:4,int:3,stance:"neutral",cadence:"Monthly",cares:"Checkout roadmap"},
    {id:"raj",name:"Raj P.",role:"Eng Director",inf:3,int:2,stance:"supporter",cadence:"Monthly",cares:"Capacity, hiring"}
  ],

    {id:"sso",title:"Enterprise SSO",wsjf:{bv:8,tc:5,rr:8,size:5},rice:{r:2000,i:2,c:80,e:3}},
    {id:"audit",title:"Audit logging",wsjf:{bv:5,tc:2,rr:8,size:3},rice:{r:800,i:1,c:90,e:2}},
    {id:"rn",title:"Release-notes engine",wsjf:{bv:8,tc:3,rr:3,size:8},rice:{r:1200,i:2,c:70,e:5}},
    {id:"a11y",title:"Checkout a11y pass",wsjf:{bv:5,tc:8,rr:2,size:3},rice:{r:5000,i:1,c:85,e:2}},
    {id:"proration",title:"Billing proration",wsjf:{bv:3,tc:2,rr:2,size:2},rice:{r:400,i:0.5,c:60,e:2}}
  ],
  releases:[
    {id:"v23",ver:"v2.3",name:"Checkout + Fraud",status:"Deploying",envs:[["dev","success"],["staging","success"],["prod","running"]]},
    {id:"v22",ver:"v2.2",name:"Ledger phase 1",status:"Released",envs:[["dev","success"],["staging","success"],["prod","success"]]}
  ],
  dora:{freq:"3.2 / week",lead:"1.4 days",cfr:"9%",mttr:"52 min"},
  emails:[
    {kind:"needs_reply",from:"Priya N.",sum:"Confirm the Ledger cutover date before the board deck.",link:"Ledger Migration"},
    {kind:"decision",from:"Marcus L.",sum:"Wants sign-off on the fraud model threshold change.",link:"Fraud Signals v2"},
    {kind:"risk",from:"Vendor",sum:"Payment gateway maintenance window overlaps release v2.3.",link:"Release v2.3"},
    {kind:"fyi",from:"Elena V.",sum:"Shared updated Q2 roadmap for Checkout.",link:"Mobile Checkout"}
  ],
  today:[
    {t:"sprint_end",u:"high",txt:"Sprint 14 ends Fri — 3 stories still In Progress on Checkout",ref:"checkout"},
    {t:"deploy",u:"high",txt:"Release v2.3 is deploying to prod — watch the gateway maintenance overlap",ref:"v23"},
    {t:"stakeholder",u:"med",txt:"Draft Priya's biweekly update (she tracks the Ledger benefit) — due Thu",ref:"priya"},
    {t:"capacity",u:"high",txt:"Sam is at 122% across Jira + Monday — rebalance before next sprint",ref:"sam"},
    {t:"one_on_one",u:"med",txt:"You haven't met Lin in 3 weeks — she has an open infra goal",ref:"lin"},
    {t:"gate",u:"med",txt:"Ledger Gate 2 review is Mar 22 — 2 deliverables still unaccepted",ref:"ledger"},
    {t:"complex",u:"low",txt:"Auth-rewrite (high-complexity) has been quiet 4 days — check in with Dana",ref:"dana"}
  ],
  meetings:[["9:00","Standup · Checkout"],["11:30","1:1 open slot"],["14:00","Risk review · Marcus"],["16:00","Sprint 14 review prep"]],
  intel:{tiers:[["Deterministic",57,"var(--teal)"],["Exact cache",22,"var(--teal3)"],["Semantic",6,"var(--blue)"],["Learned",4,"var(--violet)"],["LLM",11,"var(--amber)"]],
    saved:"1.84M",features:"38.2k",models:[["email.classify","classifier","shadow",0.91],["prioritization.suggest","regression","live",0.86],["brief.narrate","preference","logging",null]]}
};
const uibq={needs_reply:["var(--flag)","Needs reply"],decision:["var(--violet)","Decision"],risk:["var(--amber)","Risk"],fyi:["var(--faint)","FYI"]};
const uu={high:"var(--flag)",med:"var(--amber)",low:"var(--faint)"};
const initials=n=>n.split(" ").map(w=>w[0]).slice(0,2).join("");
const proj=id=>D.projects.find(p=>p.id===id);const tm=id=>D.team.find(t=>t.id===id);

/* ============================== STATE / SHELL ============================== */
const S={view:"today",arg:null,modal:null};
const $=id=>document.getElementById(id);
function render(){S.view==="setup"?($("root").innerHTML=setup()):($("root").innerHTML=shell(body()));wire();}

function shell(inner){
  const grp=(head,items)=>`<div class="navhead">${head}</div>`+items.map(n=>`<div class="nav ${S.view===n.v?'on':''}" data-go="${n.v}"><span class="ic">${n.ic}</span>${n.l}${n.tag?`<span class="tag" style="margin-left:auto;border-color:rgba(255,255,255,.18);color:#9fc7c1">${n.tag}</span>`:''}</div>`).join("");
  return `<div style="display:flex;min-height:100vh">
    <div style="width:230px;flex:none;background:linear-gradient(200deg,#0b3d39,#0f4f49);display:flex;flex-direction:column;padding:14px 11px;position:sticky;top:0;height:100vh">
      <div style="display:flex;align-items:center;gap:9px;padding:3px 5px">
        <div style="width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff">A</div>
        <div><div style="font-weight:700;color:#fff;font-size:14px;line-height:1">PM Artifactor</div><div class="mono" style="font-size:9px;color:#7fb5ad;letter-spacing:.1em;margin-top:2px">LOCAL · POC</div></div>
      </div>
      <div style="flex:1;overflow:auto;margin-top:4px">
        ${grp("Command",[{v:"today",ic:"◉",l:"Today",tag:"7"},{v:"inbox",ic:"✉",l:"Inbox",tag:"4"}])}
        ${grp("Manage",[{v:"portfolio",ic:"◆",l:"Portfolio"},{v:"programs",ic:"◈",l:"Programs",tag:"2"},{v:"projects",ic:"▤",l:"Projects",tag:"3"},{v:"prioritize",ic:"⇅",l:"Prioritize"}])}
        ${grp("Deliver",[{v:"releases",ic:"⛴",l:"Releases"},{v:"dora",ic:"◗",l:"Deploy Health"}])}
        ${grp("People",[{v:"team",ic:"◇",l:"Team",tag:"4"},{v:"stakeholders",ic:"⌘",l:"Stakeholders",tag:"4"}])}
        ${grp("System",[{v:"intel",ic:"❖",l:"Intelligence"},{v:"connections",ic:"⊚",l:"Connections"},{v:"vault",ic:"⛁",l:"Vault"}])}
      </div>
      <div style="border-top:1px solid rgba(255,255,255,.1);padding-top:10px;margin-top:6px">
        <div style="display:flex;align-items:center;gap:8px"><span class="live" style="width:7px;height:7px;border-radius:50%;background:#34d399;flex:none"></span><div style="font-size:11px;color:#cddbd8;font-weight:600">Local · encrypted</div></div>
        <div class="mono" style="font-size:9.5px;color:#7fb5ad;margin-top:3px;padding-left:15px">${D.vault.path} · ${D.vault.size}</div>
      </div>
    </div>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column">
      <div style="height:54px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:12px;position:sticky;top:0;z-index:5">
        <div style="font-weight:700;font-size:14.5px">${crumb()}</div>
        <div style="margin-left:auto;display:flex;align-items:center;gap:9px">
          <span style="display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--teal);background:var(--share-bg);padding:5px 10px;border-radius:20px"><span style="width:6px;height:6px;border-radius:50%;background:var(--teal3)"></span>Read-only · offline-ready</span>
          <button class="ghost" data-go="connections">↻ Enrich · ${D.vault.enrich}</button>
        </div>
      </div>
      <div style="flex:1;overflow:auto;padding:22px">${inner}</div>
    </div>
  </div>${S.modal||''}`;
}
const CR={today:"Today",inbox:"Inbox",portfolio:"Portfolio",programs:"Programs",projects:"Projects",prioritize:"Prioritize backlog",releases:"Release Command Center",dora:"Deployment Health",team:"Team",stakeholders:"Stakeholders",intel:"System Intelligence",connections:"Connections",vault:"Your Vault"};
function crumb(){if(S.view==="project")return `<span style="color:var(--faint)">Projects</span> › ${proj(S.arg).name}`;if(S.view==="person")return `<span style="color:var(--faint)">Team</span> › ${tm(S.arg).name}`;return CR[S.view]||"";}

function body(){const f={today:today,inbox:inbox,portfolio:portfolio,programs:programs,projects:projects,project:project,prioritize:prioritize,releases:releases,dora:dora,team:team,person:person,stakeholders:stakeholders,intel:intel,connections:connections,vault:vault}[S.view];return f?f():today();}

/* helpers */
function panel(t,inner,sub){return `<div class="card" style="padding:16px"><div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px"><div class="h2">${t}</div>${sub?`<div style="font-size:10px;color:var(--faint);max-width:210px;text-align:right;line-height:1.3">${sub}</div>`:''}</div>${inner}</div>`;}
function healthDot(h){const c=h>=75?"var(--win)":h>=60?"var(--amber)":"var(--flag)";return `<span style="width:8px;height:8px;border-radius:50%;background:${c};display:inline-block"></span>`;}
function healthColor(h){return h>=75?"var(--win)":h>=60?"var(--amber)":"var(--flag)";}
function bars(v,max,color){return `<div style="height:8px;background:var(--bg);border-radius:5px;overflow:hidden"><div class="bar" style="height:100%;width:${Math.min(v/max*100,100)}%;background:${color};border-radius:5px"></div></div>`;}
function spark(vals,color){const mx=Math.max(...vals),pts=vals.map((v,i)=>`${8+i*20},${34-v/mx*24}`).join(" ");return `<svg width="${8+vals.length*20}" height="38"><polyline class="spark" points="${pts}" fill="none" stroke="${color||'var(--teal2)'}" stroke-width="2" stroke-linecap="round"/></svg>`;}

/* ============================== SETUP ============================== */
function setup(){return `<div class="view" style="min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr">
  <div style="background:linear-gradient(155deg,#0f766e,#0d9488 55%,#14b8a6);color:#fff;padding:52px 56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden">
    <div style="position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:32px 32px;opacity:.5"></div>
    <div style="display:flex;align-items:center;gap:11px;position:relative"><div style="width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px">A</div><span style="font-weight:700;font-size:18px">PM Artifactor</span><span class="mono" style="font-size:10px;letter-spacing:.13em;color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.3);padding:2px 7px;border-radius:20px">FULL POC</span></div>
    <div style="position:relative;max-width:460px">
      <div style="font-size:32px;font-weight:800;line-height:1.13;letter-spacing:-.02em;margin-bottom:16px">One canonical model over every tool — with a copilot that reads all of it.</div>
      <div style="font-size:14px;line-height:1.65;color:rgba(255,255,255,.85)">Portfolio to program to project to work item to commit to deploy — federated read-only from Jira, Azure DevOps, GitHub and Monday, or authored standalone. Prioritization, stakeholders, sprint analytics, health checks, and a daily command center. Deterministic where it can be, AI only where it must, learning over time.</div>
    </div>
    <div class="mono" style="position:relative;font-size:11px;color:rgba(255,255,255,.65);display:flex;align-items:center;gap:8px"><span style="width:7px;height:7px;border-radius:50%;background:#34d399"></span>LOCAL-FIRST · READ-ONLY INTEGRATIONS · ON THIS DEVICE</div>
  </div>
  <div style="display:flex;align-items:center;justify-content:center;padding:40px"><div style="width:100%;max-width:380px">
    <div class="eyebrow" style="margin-bottom:8px">First run · no sign-in</div>
    <div style="font-size:22px;font-weight:800;margin-bottom:4px">Open your workspace</div>
    <div class="sub" style="margin-bottom:20px">Everything is stored in one encrypted file on this machine. Explore the POC with sample data.</div>
    <div style="margin-bottom:12px"><label>Your name</label><input value="Alex Morgan"></div>
    <div style="margin-bottom:18px"><label>Vault location</label><input class="mono" style="font-size:12px" value="~/PM-Vault/workspace.vault"></div>
    <button class="btn" style="width:100%;padding:11px" data-go="today">Enter workspace →</button>
    <div style="text-align:center;font-size:11px;color:var(--faint);margin-top:12px">Runs as a desktop app · macOS · Windows · Linux</div>
  </div></div>
</div>`;}

/* ============================== TODAY (COPILOT) ============================== */
function today(){
  const items=D.today.map((a,i)=>`<div class="row" style="display:flex;gap:12px;align-items:start;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer" data-jump="${a.t}:${a.ref}">
    <span style="width:8px;height:8px;border-radius:50%;background:${uu[a.u]};flex:none;margin-top:5px"></span>
    <div style="flex:1"><div style="font-size:13.5px;line-height:1.4">${a.txt}</div><div class="mono" style="font-size:9.5px;color:var(--faint);margin-top:3px">${a.t.replace('_',' ')} · ${a.u} priority</div></div>
    <span style="font-size:16px;color:var(--line2)">›</span></div>`).join("");
  const mtg=D.meetings.map(m=>`<div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)"><span class="mono" style="font-size:11px;color:var(--teal);width:42px">${m[0]}</span><span style="font-size:12.5px">${m[1]}</span></div>`).join("");
  return `<div class="view">
    <div style="display:flex;align-items:end;justify-content:space-between;margin-bottom:6px"><div><div class="eyebrow">Wednesday · Mar 16</div><div class="h1" style="margin-top:3px">Good morning, Alex</div></div><span class="chip" style="background:var(--violet-bg);color:var(--violet)">❖ brief composed · deterministic + AI narration</span></div>
    <div class="card" style="padding:16px 18px;margin:14px 0;background:linear-gradient(120deg,#f0fdfa,#fff)">
      <div style="font-size:14.5px;line-height:1.55;font-weight:500">Today is <b>sprint-end for Checkout</b> with 3 stories open, <b>v2.3 is deploying to prod</b> during a risky gateway window, and <b>Sam is overloaded at 122%</b>. Priya's biweekly update is due Thursday. Two health scores slipped this week — Checkout and Ledger.</div>
    </div>
    <div class="grid" style="grid-template-columns:1.6fr 1fr">
      <div class="card" style="overflow:hidden"><div style="padding:13px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center"><div class="h2">Your shifting task list</div><span class="mono" style="font-size:10px;color:var(--faint)">re-ranks through the day</span></div>${items}</div>
      <div style="display:flex;flex-direction:column;gap:16px">
        ${panel("Today's calendar",mtg,"read-only")}
        ${panel("Suggested",`<div style="display:flex;flex-direction:column;gap:8px">
          <button class="ghost" style="text-align:left" data-go="stakeholders">✎ Draft Priya's update</button>
          <button class="ghost" style="text-align:left" data-jump="one_on_one:lin">◈ Schedule 1:1 with Lin (11:30 open)</button>
          <button class="ghost" style="text-align:left" data-go="team">▦ Rebalance Sam's load</button></div>`)}
      </div>
    </div>

/* ============================== PRIORITIZE (WSJF / RICE) ============================== */
function prioritize(){
  const model=S.arg||"WSJF";
  const scored=D.backlog.map(b=>{
    const wsjf=+(( b.wsjf.bv+b.wsjf.tc+b.wsjf.rr)/b.wsjf.size).toFixed(2);
    const rice=+(((b.rice.r*b.rice.i*(b.rice.c/100))/b.rice.e)/100).toFixed(1);
    return {...b,wsjf,rice};
  }).sort((a,b)=>model==="WSJF"?b.wsjf-a.wsjf:b.rice-a.rice);
  const rows=scored.map((b,i)=>{
    const comp=model==="WSJF"
      ?[["Biz value",b.wsjf.bv,13],["Time crit",b.wsjf.tc,13],["Risk red",b.wsjf.rr,13],["Size",b.wsjf.size,13]]
      :[["Reach",b.rice.r,5000],["Impact",b.rice.i,3],["Confidence",b.rice.c,100],["Effort",b.rice.e,8]];
    return `<div class="row" style="display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line)">
      <div class="mono" style="width:20px;color:var(--faint)">${i+1}</div>
      <div style="width:170px;font-weight:600;font-size:13.5px">${b.title}</div>
      <div style="flex:1;display:flex;gap:14px">${comp.map(c=>`<div style="flex:1"><div style="display:flex;justify-content:space-between;font-size:9.5px;color:var(--faint);margin-bottom:3px" class="mono"><span>${c[0]}</span><span>${c[1]}</span></div>${bars(c[1],c[2],'var(--teal3)')}</div>`).join("")}</div>
      <div style="width:60px;text-align:right"><div class="mono" style="font-weight:700;font-size:15px;color:var(--teal)">${model==="WSJF"?b.wsjf:b.rice}</div></div>
    </div>`;
  }).join("");
  return `<div class="view" style="max-width:960px">
    <div style="display:flex;align-items:end;justify-content:space-between"><div><div class="h1">Prioritize</div><div class="sub" style="margin-top:3px">Rank any backlog with a swappable model. Scores are computed deterministically; AI only proposes the subjective inputs.</div></div>
      <div style="display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:10px">${["WSJF","RICE"].map(m=>`<button class="${m===model?'btn':'ghost'}" style="border:none;${m!==model?'background:transparent':''}" data-model="${m}">${m}</button>`).join("")}</div>
    </div>
    <div class="card" style="overflow:hidden;margin-top:16px"><div style="padding:11px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between"><div class="h2">${model} ranking</div><span class="mono" style="font-size:10.5px;color:var(--muted)">${model==="WSJF"?"(BizValue + TimeCrit + RiskRed) ÷ Size":"(Reach × Impact × Confidence) ÷ Effort"}</span></div>${rows}</div>
    <div style="font-size:11.5px;color:var(--faint);margin-top:12px">⇅ Switch models to see where they disagree — WSJF favors time-critical work, RICE favors reach. Both are pure computation (no tokens).</div>
  </div>`;
}

      <div style="display:flex;flex-direction:column;gap:16px">
        ${panel("Skills — proficiency vs interest",`<div style="display:flex;flex-direction:column;gap:11px">${t.skill.map(s=>`<div><div style="font-size:12.5px;margin-bottom:5px;font-weight:500">${s[0]}</div>
          <div style="display:grid;grid-template-columns:60px 1fr;gap:8px;align-items:center;margin-bottom:3px"><span class="mono" style="font-size:9px;color:var(--faint)">SKILL</span>${bars(s[1],5,'var(--teal2)')}</div>
          <div style="display:grid;grid-template-columns:60px 1fr;gap:8px;align-items:center"><span class="mono" style="font-size:9px;color:var(--faint)">INTEREST</span>${bars(s[2],5,'var(--teal3)')}</div></div>`).join("")}<div style="font-size:10.5px;color:var(--faint)">big gap = stretch opportunity</div></div>`,"good at vs wants to do")}
        ${panel("Where they flow",`<div style="display:flex;gap:8px">${[["Low",.7],["Med",.95],["High",1.15]].map(b=>`<div style="flex:1;text-align:center"><div style="height:50px;display:flex;align-items:end;background:var(--bg);border-radius:6px;padding:3px"><div class="bar" style="width:100%;height:${b[1]/1.3*100}%;background:${b[1]>=1?'var(--teal2)':'var(--line2)'};border-radius:4px"></div></div><div style="font-size:10px;color:var(--muted);margin-top:4px">${b[0]} cx</div></div>`).join("")}</div>
          <div style="font-size:11.5px;color:var(--muted);background:var(--bg);padding:9px 11px;border-radius:8px;margin-top:10px">Flows on high-complexity backend; de-risks first. A planning aid — never a performance score.</div>`,"deterministic · statistical")}
      </div>
    </div></div>`;
}

/* ============================== STAKEHOLDERS ============================== */
function stakeholders(){
  const q=(inf,int)=>inf>=4&&int>=4?"Manage closely":inf>=4?"Keep satisfied":int>=4?"Keep informed":"Monitor";
  const grid=`<svg viewBox="0 0 300 260" style="width:100%;height:260px">
    <line x1="40" y1="20" x2="40" y2="230" stroke="var(--line2)"/><line x1="40" y1="230" x2="290" y2="230" stroke="var(--line2)"/>
    <line x1="165" y1="20" x2="165" y2="230" stroke="var(--line)" stroke-dasharray="3 3"/><line x1="40" y1="125" x2="290" y2="125" stroke="var(--line)" stroke-dasharray="3 3"/>
    <text x="8" y="130" font-size="9" fill="#9aa1ab" transform="rotate(-90 12 125)">Influence →</text><text x="150" y="248" font-size="9" fill="#9aa1ab">Interest →</text>
    ${["Keep satisfied","Manage closely","Monitor","Keep informed"].map((l,i)=>`<text x="${i%2?175:52}" y="${i<2?36:145}" font-size="8" fill="#c3c9d0" font-weight="600">${l}</text>`).join("")}
    ${D.stakeholders.map(s=>`<g><circle cx="${40+s.int*46}" cy="${230-s.inf*40}" r="9" fill="${s.stance==='supporter'?'var(--teal2)':s.stance==='skeptic'?'var(--flag)':'var(--faint)'}" opacity=".85"/><text x="${40+s.int*46}" y="${230-s.inf*40-13}" font-size="9" text-anchor="middle" fill="#1a1d23" font-weight="600">${s.name.split(' ')[0]}</text></g>`).join("")}
  </svg>`;
  const cards=D.stakeholders.map(s=>`<div class="card row" style="padding:14px;cursor:pointer">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><div class="avatar" style="width:34px;height:34px;font-size:12px">${initials(s.name)}</div><div style="flex:1"><div style="font-weight:700;font-size:13.5px">${s.name}</div><div class="sub" style="font-size:11px">${s.role}</div></div><span style="width:8px;height:8px;border-radius:50%;background:${s.stance==='supporter'?'var(--win)':s.stance==='skeptic'?'var(--flag)':'var(--faint)'}"></span></div>
    <div style="font-size:11.5px;color:var(--muted);margin-bottom:8px">Invested in: <b style="color:var(--ink)">${s.cares}</b></div>
    <div style="display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:9px"><span class="tag">${q(s.inf,s.int)}</span><span class="mono" style="font-size:10px;color:var(--amber)">${s.cadence}</span></div>
  </div>`).join("");
  return `<div class="view"><div class="h1">Stakeholders</div><div class="sub" style="margin:3px 0 16px">The mirror of the team directory, pointed outward — profiles, cadence, and what each is invested in, linked to the P/P/P entities they touch.</div>
    <div class="grid" style="grid-template-columns:1fr 1.4fr">
      ${panel("Power–interest grid",grid,"teal=supporter · red=skeptic")}
      <div class="grid" style="grid-template-columns:1fr 1fr;align-content:start">${cards}</div>
    </div>
    <div class="card" style="padding:15px;margin-top:16px;display:flex;align-items:center;gap:14px"><div style="flex:1"><div class="h2">Priya's biweekly update is due Thursday</div><div class="sub">Auto-assembled from the Ledger benefit + Gate 2 status she tracks — AI drafts, you send.</div></div><button class="btn">✎ Draft update</button></div>
  </div>`;
}

/* ============================== INTELLIGENCE ============================== */
function intel(){
  const ladder=D.intel.tiers.map(t=>`<div style="display:flex;align-items:center;gap:12px;margin-bottom:9px"><div style="width:100px;font-size:12.5px;font-weight:500">${t[0]}</div><div style="flex:1">${bars(t[1],60,t[2])}</div><span class="mono" style="font-size:11px;width:34px;text-align:right">${t[1]}%</span></div>`).join("");
  const models=D.intel.models.map(m=>{const st={shadow:["var(--amber)","shadow"],live:["var(--win)","live · cascade"],logging:["var(--faint)","logging"]}[m[2]];return `<div class="row" style="display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)"><span class="mono" style="flex:1;font-size:12.5px">${m[0]}</span><span class="tag">${m[1]}</span><span style="font-size:11px;font-weight:600;color:${st[0]}">${st[1]}</span><span class="mono" style="font-size:11px;color:var(--muted);width:42px;text-align:right">${m[3]!==null?m[3]:'—'}</span></div>`;}).join("");
  return `<div class="view" style="max-width:920px"><div class="h1">System Intelligence</div><div class="sub" style="margin:3px 0 16px">The three-layer engine: compute what you can, generate only what you must, learn over time. This panel is the dial.</div>
    <div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">${[["Tokens saved (30d)",D.intel.saved,"var(--win)"],["Feature records",D.intel.features,"var(--teal)"],["LLM traffic","11%","var(--amber)"]].map(k=>`<div class="card" style="padding:16px"><div class="eyebrow">${k[0]}</div><div class="kpi" style="color:${k[2]};margin-top:4px">${k[1]}</div></div>`).join("")}</div>
    <div class="grid" style="grid-template-columns:1fr 1fr">
      ${panel("Resolution ladder · where requests are served",ladder,"cheapest correct tier first")}
      ${panel("Learning layer · maturity",models,"shadow before serve · LLM as fallback")}
    </div>
    <div class="card" style="padding:16px;margin-top:16px"><div class="h2" style="margin-bottom:10px">The pipeline</div>
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px">
        ${["Sources (read-only)","Deterministic compute","Feature records","Generative (LLM)","Human accept/edit","Training corpus","Learned models"].map((s,i,a)=>`<span style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-weight:500">${s}</span>${i<a.length-1?'<span style="color:var(--teal3)">→</span>':''}`).join("")}
      </div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:12px">Every deterministic result is a feature; every human verdict is a label. The corpus trains the learned tier, which graduates tasks off the LLM as it proves itself in shadow.</div>
    </div></div>`;
}

/* ============================== CONNECTIONS / VAULT ============================== */
function connections(){
  const C=[["Jira","WorkTracker","12 min ago",1],["GitHub","SourceControl · CICD","12 min ago",1],["Azure DevOps","Boards · Repos · Pipelines","1h ago",1],["Bitbucket","SourceControl · CICD","1h ago",1],["Google Calendar","Calendar","8 min ago",1],["Gmail","Mail","2h ago",1],["Monday","WorkTracker","—",0],["Confluence","KnowledgeBase","—",0]];
  return `<div class="view" style="max-width:820px"><div class="h1">Connections</div><div class="sub" style="margin:3px 0 16px">Your own accounts, read-only. Pulled to enrich the canonical model — nothing is written back, nothing leaves this device.</div>
    <div class="grid" style="grid-template-columns:1fr 1fr">${C.map(c=>`<div class="card" style="padding:15px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:9px"><div style="width:30px;height:30px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--teal)">${c[0][0]}</div><div style="flex:1"><div style="font-weight:700;font-size:13.5px">${c[0]}</div><div class="mono" style="font-size:9px;color:var(--faint)">${c[1]}</div></div></div>${c[3]?`<div style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--teal);font-weight:600"><span style="width:6px;height:6px;border-radius:50%;background:var(--teal3)"></span>Read-only · pulled ${c[2]}</div>`:`<button class="ghost" style="width:100%">Connect</button>`}</div>`).join("")}</div>
    <div style="font-size:11.5px;color:var(--faint);margin-top:14px">⊘ Pull-only by design. GitHub/Bitbucket monitoring stays read-only permanently.</div></div>`;
}
function vault(){
  return `<div class="view" style="max-width:720px"><div class="h1">Your Vault</div><div class="sub" style="margin:3px 0 16px">One encrypted file on this machine. Export, move, or wipe any part of it anytime.</div>
    <div class="card" style="padding:18px;margin-bottom:14px"><div style="display:flex;gap:26px;flex-wrap:wrap">${[["Location",D.vault.path],["Size",D.vault.size],["Encryption","On · AES-256"],["Teammates","4"]].map(s=>`<div><div class="eyebrow">${s[0]}</div><div style="font-size:14px;font-weight:600;margin-top:3px">${s[1]}</div></div>`).join("")}</div></div>
    <div class="grid" style="grid-template-columns:1fr 1fr"><div class="card" style="padding:16px"><div class="h2" style="margin-bottom:4px">Back up / export</div><div class="sub" style="margin-bottom:12px">A single portable file you control.</div><button class="ghost">⭳ Export vault</button></div>
    <div class="card" style="padding:16px"><div class="h2" style="margin-bottom:4px">Per-teammate data</div><div class="sub" style="margin-bottom:12px">Export or delete everything about one person.</div><button class="ghost">Manage</button></div></div>
    <div style="font-size:11.5px;color:var(--faint);margin-top:14px;line-height:1.5">Notes about people carry data-protection weight even when private. Behavioral, evidence-linked notes + honored export/delete keep this fair and defensible.</div></div>`;
}

/* ============================== NOTE MODAL ============================== */
function noteModal(){
  S.modal=`<div id="ov" style="position:fixed;inset:0;background:rgba(15,23,23,.42);display:flex;align-items:center;justify-content:center;z-index:50;animation:pmfade .2s" data-close>
    <div style="width:500px;max-width:94vw;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.28)" onclick="event.stopPropagation()">
      <div style="padding:16px 20px;border-bottom:1px solid var(--line)"><div class="h2">Add note</div><div class="sub" style="font-size:11.5px">Written to be seen — describe what happened, not who they are</div></div>
      <div style="padding:20px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
          <div class="card" style="padding:11px;border-color:var(--teal2);background:var(--share-bg)"><div style="font-weight:700;font-size:13px;color:var(--teal)">◆ Shareable</div><div style="font-size:11px;color:var(--muted);margin-top:3px">Evidence-linked. Safe in a 1:1.</div></div>
          <div class="card" style="padding:11px"><div style="font-weight:700;font-size:13px">✎ Private scratch</div><div style="font-size:11px;color:var(--muted);margin-top:3px">Auto-deletes in 30 days.</div></div>
        </div>
        <div style="margin-bottom:11px"><label>What I observed</label><textarea rows="2">Shipped conflict-replay four days ahead of commitment.</textarea></div>
        <div style="margin-bottom:11px"><label>Why it matters / how I'll support</label><input value="Give her the release-notes engine she's wanted."></div>
        <label>Link evidence</label><div style="display:flex;gap:7px"><span class="chip" style="background:var(--teal2);color:#fff">⛓ PR #812</span><span class="chip">⛓ DANA-204</span></div>
      </div>
      <div style="padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px"><button class="ghost" data-close>Cancel</button><button class="btn" data-close>Save note</button></div>
    </div></div>`;render();
}

/* ============================== WIRE ============================== */
function wire(){
  document.querySelectorAll("[data-go]").forEach(e=>e.onclick=()=>{S.view=e.dataset.go;S.arg=null;S.modal=null;render();});
  document.querySelectorAll("[data-project]").forEach(e=>e.onclick=()=>{S.view="project";S.arg=e.dataset.project;render();});
  document.querySelectorAll("[data-person]").forEach(e=>e.onclick=()=>{S.view="person";S.arg=e.dataset.person;render();});
  document.querySelectorAll("[data-model]").forEach(e=>e.onclick=()=>{S.view="prioritize";S.arg=e.dataset.model;render();});
  document.querySelectorAll("[data-note]").forEach(e=>e.onclick=ev=>{ev.stopPropagation();noteModal();});
  document.querySelectorAll("[data-close]").forEach(e=>e.onclick=()=>{S.modal=null;render();});
  document.querySelectorAll("[data-jump]").forEach(e=>e.onclick=()=>{const[k,ref]=e.dataset.jump.split(":");const map={sprint_end:["project",ref],complex:["person",ref],deploy:["releases",null],stakeholder:["stakeholders",null],capacity:["person",ref],one_on_one:["person",ref],gate:["project",ref]};const m=map[k]||["today",null];S.view=m[0];S.arg=m[1];S.modal=null;render();});
  const ov=$("ov");if(ov)ov.onclick=()=>{S.modal=null;render();};
}
S.view="setup";render();
</script>
</body>
</html>
